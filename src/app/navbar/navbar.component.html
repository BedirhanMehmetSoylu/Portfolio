<nav [attr.aria-label]="'A11Y.MAIN_NAV' | translate">
  <div class="navbar-section">
    <a class="logo-link" href="/" (click)="$event.preventDefault(); nav.goHome()">
      <img class="logo" src="assets/img/logo.png" width="216" height="39" [alt]="'A11Y.HOME' | translate">
    </a>
    <div class="navbar-right">
      <div class="link-container">
        <a href="#about">{{ 'NAV.ABOUT' | translate }}</a>
        <a href="#skills">{{ 'NAV.SKILLS' | translate }}</a>
        <a href="#portfolio">{{ 'NAV.PORTFOLIO' | translate }}</a>
      </div>
      <div class="language-btn-container" role="group" [attr.aria-label]="'A11Y.LANGUAGE' | translate">
        <button [ngClass]="{'active-lang': currentLang === 'de'}" [attr.aria-pressed]="currentLang === 'de'" lang="de" (click)="switchLang('de')">DE</button>
        <button [ngClass]="{'active-lang': currentLang === 'en'}" [attr.aria-pressed]="currentLang === 'en'" lang="en" (click)="switchLang('en')">EN</button>
      </div>
    </div>
    <button #burgerButton class="burger-icon icon-btn" type="button"
      [attr.aria-label]="(isOpen ? 'A11Y.MENU_CLOSE' : 'A11Y.MENU_OPEN') | translate"
      [attr.aria-expanded]="isOpen" aria-controls="mobile-menu" (click)="toggleMenu()">
      <img [src]="currentBurgerImage" alt="" />
    </button>
    @if (isOpen) {
      <app-mobile-menu id="mobile-menu" [currentLang]="currentLang" [activeSection]="activeSection"
        (switchLangEvent)="switchLang($event)" (close)="toggleMenu()">
      </app-mobile-menu>
    }
  </div>
</nav>
