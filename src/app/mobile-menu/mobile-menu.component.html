<div class="mobile-menu-overlay">
    <div class="mobile-menu-content">
        <a href="#about" (click)="closeMenu()" [ngClass]="{ 'active-link': activeSection === 'about' }">{{ 'NAV.ABOUT' |
            translate }}</a>

        <a href="#skills" (click)="closeMenu()" [ngClass]="{ 'active-link': activeSection === 'skills' }">{{
            'MYSKILLS.HEADLINE' | translate }}</a>

        <a href="#portfolio" (click)="closeMenu()" [ngClass]="{ 'active-link': activeSection === 'portfolio' }">{{
            'NAV.PORTFOLIO' | translate }}</a>

        <a href="#contact" (click)="closeMenu()" [ngClass]="{ 'active-link': activeSection === 'contact' }">{{
            'CONTACT.TITLE' | translate }}</a>

        <div class="language-btn-container" role="group" [attr.aria-label]="'A11Y.LANGUAGE' | translate">
            <button type="button" [ngClass]="{'active-lang': currentLang === 'en'}" [attr.aria-pressed]="currentLang === 'en'" lang="en" (click)="switchLang('en')">EN</button>
            <span class="separator" aria-hidden="true">/</span>
            <button type="button" [ngClass]="{'active-lang': currentLang === 'de'}" [attr.aria-pressed]="currentLang === 'de'" lang="de" (click)="switchLang('de')">DE</button>
        </div>
    </div>
</div>
