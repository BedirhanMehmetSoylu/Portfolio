<div class="hero-section">
  <div class="hero-top">
    <div class="portrait">
      <img class="shadow" src="assets/img/hero/hero-shadows.avif" width="859" height="820" alt="">
      <img class="person" src="assets/img/hero/hero-person-cut.avif" width="866" height="1080" fetchpriority="high" alt="Bedirhan Soylu">
    </div>

    <!-- Desktop-Variante; die Mobile-Variante unten ist per display:none ausgeblendet,
         daher liest ein Screenreader den Namen nur einmal vor -->
    <div class="hero-top-right" [class.padding-reset]="translate.currentLang() === 'de'">
      <h1 class="name-section">
        <span class="i-am">{{ 'HERO.IAM' | translate}}</span>
        <span class="name-container">
          <span class="name">Bedirhan Soylu</span>
          <span class="profession">{{ 'HERO.PROFESSION' | translate}}</span>
        </span>
      </h1>
      <button (click)="nav.scrollToSection('contact')">{{ 'HERO.LETS_TALK' | translate}}</button>
    </div>
  </div>
  <div class="hero-bottom">
    <div class="hero-bottom-name" [class.padding-reset]="translate.currentLang() === 'de'">
      <h1 class="name-section">
        <span class="i-am">{{ 'HERO.IAM' | translate}}</span>
        <span class="name-container">
          <span class="name">Bedirhan Soylu</span>
          <span class="profession">{{ 'HERO.PROFESSION' | translate}}</span>
        </span>
      </h1>
      <button [class.padding-reset]="translate.currentLang() === 'de'" (click)="nav.scrollToSection('contact')">{{ 'HERO.LETS_TALK' | translate}}</button>
    </div>
    <div class="bottom-content">
      <div class="bottom-left">
        <div class="purple-line"></div>
        <a href="https://github.com/BedirhanMehmetSoylu" target="_blank" rel="noopener noreferrer">
          <img src="assets/img/hero/github.png" width="42" height="41" [alt]="'A11Y.GITHUB' | translate">
        </a>
        <a href="#contact" (click)="$event.preventDefault(); nav.scrollToSection('contact')">
          <img src="assets/img/hero/email.png" width="40" height="40" [alt]="'A11Y.CONTACT' | translate">
        </a>
        <a href="https://www.linkedin.com/in/bedirhan-soylu/" target="_blank" rel="noopener noreferrer">
          <img src="assets/img/hero/linkedin.png" width="40" height="40" [alt]="'A11Y.LINKEDIN' | translate">
        </a>
        <a class="email" href="#contact" (click)="$event.preventDefault(); nav.scrollToSection('contact')">bedirhanmehmetsoylu&#64;gmail.com</a>
      </div>
      <div class="bottom-right" aria-hidden="true">
        <p>{{ 'HERO.SCROLL_DOWN' | translate}}</p>
        <img src="assets/img/hero/arrow.png" width="16" height="16" alt="">
      </div>
    </div>

    <img class="background" src="assets/img/hero/hero-background.avif" width="1442" height="1079" alt="">
  </div>
</div>
