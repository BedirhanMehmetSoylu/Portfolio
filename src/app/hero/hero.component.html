<div class="hero-section">
  <div class="hero-top">
    <div class="portrait">
      <img class="shadow" src="assets/img/hero/hero-shadows.avif" alt="">
      <img class="person" src="assets/img/hero/hero-person-cut.avif" alt="Bedirhan Soylu">
    </div>

    <div class="hero-top-right">
      <div class="name-section">
        <p class="i-am">{{ 'HERO.IAM' | translate}}</p>
        <div class="name-container">
          <p class="name">Bedirhan Soylu</p>
          <p class="profession">{{ 'HERO.PROFESSION' | translate}}</p>
        </div>
      </div>
      <button (click)="nav.scrollToSection('contact')">{{ 'HERO.LETS_TALK' | translate}}</button>
    </div>
  </div>
  <div class="hero-bottom">
    <div class="hero-bottom-name" [class.padding-reset]="translate.currentLang === 'de'">
      <div class="name-section">
        <p class="i-am">{{ 'HERO.IAM' | translate}}</p>
        <div class="name-container">
          <p class="name">Bedirhan Soylu</p>
          <p class="profession">{{ 'HERO.PROFESSION' | translate}}</p>
        </div>
      </div>
      <button [class.padding-reset]="translate.currentLang === 'de'" (click)="nav.scrollToSection('contact')">{{ 'HERO.LETS_TALK' | translate}}</button>
    </div>
    <div class="bottom-content">
      <div class="bottom-left">
        <div class="purple-line"></div>
        <img (click)="nav.openExternalLink('https://github.com/BedirhanMehmetSoylu')" src="assets/img/hero/github.png" alt="GitHub Profil öffnen">
        <img (click)="nav.scrollToSection('contact')" src="assets/img/hero/email.png" alt="Zum Kontaktformular springen">
        <img (click)="nav.openExternalLink('https://www.linkedin.com/in/bedirhan-soylu/')" src="assets/img/hero/linkedin.png" alt="LinkedIn Profil öffnen">
        <p (click)="nav.scrollToSection('contact')">bedirhanmehmetsoylu&#64;gmail.com</p>
      </div>
      <div class="bottom-right">
        <p>{{ 'HERO.SCROLL_DOWN' | translate}}</p>
        <img src="assets/img/hero/arrow.png" alt="">
      </div>
    </div>

    <img class="background" src="assets/img/hero/hero-background.avif" alt="">
  </div>
</div>
