<footer>
    <div class="footer-section">
        <div class="footer-left">
            <a class="footer-logo" href="/" (click)="$event.preventDefault(); nav.goHome()">
                <img src="assets/img/logo.png" width="216" height="39" loading="lazy" [alt]="'A11Y.HOME' | translate">
            </a>

            <div class="link-wrapper d-block">
                <a routerLink="/legal-notice">{{ 'FOOTER.LEGAL' | translate }}</a>
                <div class="underline"></div>
            </div>
        </div>

        <p>© Bedirhan Soylu {{ currentYear }}</p>

        <div class="footer-right">
            <a href="https://github.com/BedirhanMehmetSoylu" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/hero/github.png" width="42" height="41" loading="lazy" [alt]="'A11Y.GITHUB' | translate">
            </a>
            <a href="#contact" (click)="$event.preventDefault(); nav.scrollToSection('contact')">
                <img src="assets/img/hero/email.png" width="40" height="40" loading="lazy" [alt]="'A11Y.CONTACT' | translate">
            </a>
            <a href="https://www.linkedin.com/in/bedirhan-soylu/" target="_blank" rel="noopener noreferrer">
                <img src="assets/img/hero/linkedin.png" width="40" height="40" loading="lazy" [alt]="'A11Y.LINKEDIN' | translate">
            </a>
        </div>

        <div class="link-wrapper d-none">
                <a routerLink="/legal-notice">{{ 'FOOTER.LEGAL' | translate }}</a>
                <div class="underline"></div>
        </div>

    </div>
</footer>
